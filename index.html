<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authorised</title>
  <script src="https://kit.fontawesome.com/4862b63bc6.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Fredoka One', sans-serif;
    }

    body {
      background: #0d0d0d;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      height: 100vh;
      justify-content: center;
      position: relative;
    }

    .hdr {
      font-size: 28px;
      margin-bottom: 16px;
      color: #b6fcd5;
    }

    .inbx {
      background-color: rgba(0, 0, 0, 0.65);
      padding: 16px;
      border-radius: 16px;
      border: 1px solid rgba(0, 255, 128, 0.2);
      backdrop-filter: blur(12px);
      margin-bottom: 20px;
      width: 600px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
    }

    .srch {
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(0, 255, 128, 0.2);
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 20px;
      width: 600px;
      color: white;
    }

    .appc {
      background-color: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(0, 255, 128, 0.2);
      backdrop-filter: blur(12px);
      width: 600px;
      border-radius: 20px;
      padding: 24px 30px;
      box-shadow: 0 0 12px rgba(0, 255, 128, 0.1);
      margin-bottom: 20px;
    }

    .apphd {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .appif {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .applg {
      width: 40px;
      height: 40px;
      background-color: black;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #00ff80;
      box-shadow: 0 0 6px rgba(0,255,128,0.3);
    }

    .appnm {
      font-size: 18px;
      color: white;
    }

    .authd {
      font-size: 12px;
      color: #b5bac1;
    }

    .expand {
      background-color: rgba(0, 255, 128, 0.05);
      margin-top: 20px;
      border-radius: 12px;
      padding: 16px;
      font-size: 14px;
      color: #d1d1d1;
      border: 1px solid rgba(0, 255, 128, 0.15);
    }

    .expand a {
      color: #00ff80;
      text-decoration: none;
    }

    .expand a:hover {
      text-decoration: underline;
    }

    .perms {
      margin-top: 12px;
      color: #b5bac1;
    }

    .perms span::before {
      content: "✔ ";
      color: #00ff80;
    }

    .deauth {
      background-color: rgba(255, 0, 0, 0.75);
      color: white;
      padding: 8px 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.3s;
    }

    .deauth:hover {
      background-color: rgba(255, 0, 0, 0.9);
    }

    #verystat {
      margin-top: 12px;
      font-size: 14px;
      color: #b5bac1;
    }

    #verystat.success {
      color: #00ff80;
    }

    .randbtn {
      position: absolute;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      background-color: rgba(0, 255, 128, 0.8);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      cursor: pointer;
      border: none;
      box-shadow: 0 0 5px rgba(0,255,128,0.5);
      transition: all 0.3s;
    }

    .randbtn:hover {
      background-color: rgba(0, 255, 128, 1);
      transform: scale(1.1);
    }

    .randbtn-container {
      position: absolute;
      top: -70px;
      z-index: 10;
      display: flex;
      justify-content: space-evenly;
      width: 100%;
    }

  </style>
</head>
<body>

  <div class="randbtn-container">
  </div>

  <div class="hdr">Authorised</div>

  <div class="appc">
    <div class="apphd">
      <div class="appif">
        <div class="applg"><i class="fa-thin fa-hand"></i></div>
        <div>
          <div class="appnm">BolimowskiDysk Authorised</div>
          <div class="authd">Prozba o dostęp.</div>
        </div>
      </div>
    </div>

    <div id="verify" style="text-align: center; margin-top: 30px;">
      <button id="vbtn" class="deauth">
        <i class="fa-solid fa-shield-halved"></i> Potwierdz, że nie jestes botem/psem
      </button>
      <p id="verystat"></p>
    </div>
  </div>

  <script>
    let randBtns = [];
    function createRandomButtons() {
      const icons = [
        'fa-dog', 'fa-cat', 'fa-fish', 'fa-horse', 'fa-rocket', 'fa-heart', 'fa-car', 'fa-bicycle', 'fa-moon'
      ];

      randBtns.forEach(btn => btn.remove());
      randBtns = [];

      for (let i = 0; i < 4; i++) {
        const randBtn = document.createElement("button");
        randBtn.classList.add("randbtn");
        const icon = icons[Math.floor(Math.random() * icons.length)];
        randBtn.innerHTML = `<i class="fa-solid ${icon}"></i>`;
        randBtn.style.top = `${Math.random() * 20 + 30}vh`;
        randBtn.style.left = `${Math.random() * 90}vw`;

        randBtns.push(randBtn);
        document.querySelector('.randbtn-container').appendChild(randBtn);

        randBtn.addEventListener("click", function () {
          startVerification();
          randBtns.forEach((btn) => btn.style.display = "none");
        });
      }
    }

    function startVerification() {
      const btn = document.getElementById("vbtn");
      const stat = document.getElementById("verystat");

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verifikuje...';
      stat.textContent = "Please wait while we confirm you're not a bot.";

      const delay = Math.floor(Math.random() * (10000 - 4000 + 1)) + 4000;

 setTimeout(async () => {
    stat.innerHTML =
        '<i class="fa-solid fa-check-circle"></i> Verifikacja pzebiegła pomyślnie! Redirecting...';

    stat.classList.add("success");
    btn.style.display = "none";

    try {
        const response = await fetch("./config.json");

        if (!response.ok) {
            throw new Error("config.json not found");
        }

        const config = await response.json();

        if (config.redirect && config.redirect.trim() !== "") {
            setTimeout(() => {
                window.location.href = config.redirect;
            }, 1500);
        } else {
            window.location.href = "404.html";
        }
    } catch (e) {
        console.error(e);
        window.location.href = "404.html";
    }
}, delay);
    }
    setTimeout(() => {
      createRandomButtons();
    }, 20000);

    document.getElementById("vbtn").addEventListener("click", function () {
      createRandomButtons();
    });

  </script>
</body>
</html>
